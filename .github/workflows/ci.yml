name: Verify Lean formalization

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check sources and metadata
        run: |
          python3 scripts/check-lean-sources.py
          python3 verification/check_sources.py
          ruby scripts/validate-formalization.rb formalization.yaml
      - uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          auto-config: false
          build: true
          test: false
          lint: false
          use-mathlib-cache: true
      - name: Audit statements, axioms and independent kernels
        run: bash verify.sh --kernels
