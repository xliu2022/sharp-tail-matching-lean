project:
  name: Sharp i.i.d. tail probabilities and large hypergraph matchings
  description: A Lean formalization of the sharp upper tail bound for sums of independent
    identically distributed nonnegative random variables, including all maximizing
    laws and boundary cases, and the exact Erdős matching bound with its equality
    classification for every fixed uniformity k >= 3 and all sufficiently large matching
    parameters, uniformly over n >= k(s+1).
