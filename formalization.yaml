fidelity:
  divergences: The sharp optimization value is expressed by an upper-bound theorem
    and an attainment theorem, jointly equivalent to the supremum formula. Laws are
    arbitrary Borel probability measures on the nonnegative reals, with mean defined
    by an extended nonnegative integral; there is no finite-support or bounded-support
    restriction. The matching universe is Fin n, preserving arbitrary finite hypergraphs
    up to relabeling. The approximate-cover lemma is proved in a stronger form without
    ξ < 1/k, permitting a uniform compact stability proof through both endpoints.
    The original nine Challenge targets and all equality cases are retained. Mathematical
    proof completion is distinct from the pending protected Palomar verification.
